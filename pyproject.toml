[project]
name = "labellens"
version = "0.1.0"
description = "Cited answers and typed extraction over FDA drug labels, with an eval harness."
license = { text = "MIT" }
authors = [{ name = "Sreya Sivan", email = "contact@sreyasivan.me" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "fastapi>=0.115", "uvicorn>=0.30"]
anthropic = ["anthropic>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["labellens"]

[tool.setuptools.package-data]
labellens = ["static/*"]
