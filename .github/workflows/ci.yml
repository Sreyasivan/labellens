name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q

  # Retrieval gate: real pgvector, real openFDA labels (the eval drugs only, to keep it under a few
  # minutes), real embeddings. Fails when the question set no longer checks out against the label
  # text or when hybrid recall@5 drops below the floor. The README numbers come from the full
  # 2,000-label index; this job proves the pipeline end to end on every push.
  eval:
    runs-on: ubuntu-latest
    needs: test
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: labellens
          POSTGRES_USER: labellens
          POSTGRES_PASSWORD: labellens
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U labellens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://labellens:labellens@localhost:5433/labellens
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - run: uv sync
      - run: uv run python -m labellens.db
      - run: uv run python -m labellens.ingest --only-eval
      - run: uv run python eval/check_questions.py
      - run: uv run python eval/run_eval.py --min-recall 0.9
